name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same branch when a new push lands. Keeps
# the queue small on a hackathon repo where main is pushed often.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pin matches root package.json `packageManager` field.
          version: 10.33.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # landing/ imports `@sniffy/scraper/schemas` in 20+ files; that subpath
      # resolves to `scraper/dist/schemas/index.js` via the package's exports
      # map. Build scraper here so landing's typecheck + tests + Next build
      # can resolve the import on a fresh CI checkout. Mirrors the same
      # `pnpm --filter` chain baked into landing/package.json's `build`.
      - name: Build @sniffy/scraper (landing import resolution)
        run: pnpm --filter @sniffy/scraper run build

      # packages/cli + packages/mcp depend on @gosniffy/sdk via workspace:*.
      # The SDK's exports map points at dist/, so consumers cannot typecheck
      # until tsup has produced that dist. Mirrors the scraper prebuild above.
      - name: Build @gosniffy/sdk (cli + mcp import resolution)
        run: pnpm --filter @gosniffy/sdk run build

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Test workspace
        run: pnpm -r test
        env:
          # Pin a deterministic Morph network for any test that reads env.ts.
          MORPH_NETWORK: eip155:2818
          NODE_ENV: test
