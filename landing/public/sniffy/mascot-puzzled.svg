<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="160" height="160" shape-rendering="crispEdges" aria-label="Sniffy puzzled — head tilted, ears flopped, question mark above">
  <rect width="32" height="32" fill="none" />

  <!-- Question mark top-left -->
  <rect x="5" y="0" width="3" height="1" fill="#E5532D" />
  <rect x="7" y="1" width="2" height="1" fill="#E5532D" />
  <rect x="7" y="2" width="1" height="2" fill="#E5532D" />
  <rect x="6" y="3" width="1" height="1" fill="#E5532D" />
  <rect x="6" y="5" width="1" height="1" fill="#E5532D" />

  <!-- Hat tilted with head -->
  <rect x="14" y="0" width="4" height="1" fill="#3A322A" />
  <rect x="13" y="1" width="6" height="1" fill="#3A322A" />
  <rect x="15" y="1" width="2" height="1" fill="#F7D43A" />
  <rect x="13" y="2" width="7" height="2" fill="#3A322A" />
  <rect x="11" y="4" width="11" height="1" fill="#15110D" />

  <!-- Head shifted right + squashed top -->
  <rect x="12" y="5" width="10" height="7" fill="#15110D" />
  <!-- Both ears flop down -->
  <rect x="21" y="9"  width="2" height="3" fill="#3A322A" />
  <rect x="11" y="5"  width="1" height="2" fill="#15110D" />
  <rect x="10" y="6"  width="1" height="1" fill="#3A322A" />

  <!-- Snout, slightly raised -->
  <rect x="22" y="8"  width="4" height="3" fill="#15110D" />
  <rect x="26" y="9"  width="1" height="1" fill="#F7D43A" />
  <rect x="22" y="11" width="2" height="1" fill="#3A322A" />

  <!-- Confused brow + eye -->
  <rect x="16" y="6"  width="3" height="1" fill="#3A322A" />
  <rect x="17" y="7"  width="2" height="1" fill="#F7D43A" />
  <rect x="18" y="7"  width="1" height="1" fill="#15110D" />

  <!-- Body slumped slightly -->
  <rect x="11" y="14" width="9" height="7" fill="#15110D" />
  <rect x="11" y="14" width="9" height="1" fill="#21C2B6" />
  <rect x="14" y="15" width="2" height="1" fill="#F7D43A" />
  <rect x="12" y="19" width="7" height="2" fill="#3A322A" />

  <!-- Tail drooping low -->
  <rect x="19" y="20" width="2" height="3" fill="#15110D" />
  <rect x="20" y="21" width="1" height="2" fill="#15110D" />

  <!-- Arm hanging down toward magnifier -->
  <rect x="6"  y="19" width="6" height="2" fill="#15110D" />

  <!-- Magnifier dragged low at side, tilted -->
  <rect x="6"  y="21" width="3" height="1" fill="#21C2B6" />
  <rect x="5"  y="22" width="1" height="3" fill="#21C2B6" />
  <rect x="9"  y="22" width="1" height="3" fill="#21C2B6" />
  <rect x="6"  y="25" width="3" height="1" fill="#21C2B6" />
  <rect x="6"  y="22" width="3" height="3" fill="#F7F4EC" />
  <rect x="3"  y="26" width="2" height="1" fill="#15110D" />

  <!-- Legs -->
  <rect x="13" y="21" width="2" height="5" fill="#15110D" />
  <rect x="12" y="26" width="4" height="1" fill="#3A322A" />
  <rect x="16" y="22" width="2" height="4" fill="#15110D" />
  <rect x="15" y="26" width="4" height="1" fill="#3A322A" />
  <!-- Back haunch -->
  <rect x="19" y="19" width="3" height="5" fill="#15110D" />
  <rect x="20" y="24" width="3" height="1" fill="#3A322A" />
</svg>
