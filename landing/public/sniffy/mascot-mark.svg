<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true">
  <rect width="16" height="16" fill="none" />

  <!-- Hat -->
  <rect x="6" y="0" width="4" height="1" fill="#3A322A" />
  <rect x="7" y="0" width="1" height="1" fill="#F7D43A" />
  <rect x="4" y="1" width="8" height="1" fill="#15110D" />

  <!-- Head main mass -->
  <rect x="5" y="2" width="7" height="8" fill="#15110D" />
  <!-- Right ear flopping past head -->
  <rect x="11" y="2" width="2" height="3" fill="#15110D" />
  <rect x="11" y="5" width="1" height="1" fill="#3A322A" />
  <!-- Left ear peek -->
  <rect x="5" y="1" width="1" height="1" fill="#15110D" />

  <!-- Snout protruding right (load-bearing) -->
  <rect x="12" y="6" width="3" height="3" fill="#15110D" />
  <rect x="14" y="6" width="1" height="1" fill="#F7D43A" />
  <rect x="12" y="9" width="2" height="1" fill="#3A322A" />

  <!-- Eye -->
  <rect x="8" y="4" width="1" height="1" fill="#F7D43A" />
  <rect x="7" y="7" width="1" height="1" fill="#3A322A" />

  <!-- Tiny magnifier bottom-right -->
  <rect x="11" y="11" width="3" height="1" fill="#21C2B6" />
  <rect x="11" y="12" width="1" height="2" fill="#21C2B6" />
  <rect x="13" y="12" width="1" height="2" fill="#21C2B6" />
  <rect x="11" y="13" width="3" height="1" fill="#21C2B6" />
  <rect x="12" y="12" width="1" height="1" fill="#F7F4EC" />
  <rect x="14" y="14" width="2" height="2" fill="#15110D" />
</svg>
