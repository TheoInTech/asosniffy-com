<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="160" height="160" shape-rendering="crispEdges" aria-label="Sniffy, a pixel-art detective dog sitting in profile holding a magnifying glass">
  <rect width="32" height="32" fill="none" />

  <!-- Deerstalker hat -->
  <rect x="13" y="0" width="4" height="1" fill="#3A322A" />
  <rect x="12" y="1" width="6" height="1" fill="#3A322A" />
  <rect x="14" y="1" width="2" height="1" fill="#F7D43A" />
  <rect x="11" y="2" width="8" height="2" fill="#3A322A" />
  <rect x="9"  y="4" width="12" height="1" fill="#15110D" />
  <rect x="19" y="5" width="2"  height="2" fill="#3A322A" />

  <!-- Head main mass -->
  <rect x="11" y="5" width="10" height="7" fill="#15110D" />
  <rect x="20" y="5" width="2"  height="4" fill="#15110D" />
  <!-- Right ear flopping down past head -->
  <rect x="20" y="9" width="2"  height="2" fill="#3A322A" />
  <!-- Snout protruding right (load-bearing dog signal) -->
  <rect x="21" y="9"  width="4" height="3" fill="#15110D" />
  <rect x="25" y="10" width="1" height="1" fill="#F7D43A" />
  <!-- Mouth + cheek shading -->
  <rect x="22" y="12" width="3" height="1" fill="#3A322A" />
  <rect x="14" y="11" width="4" height="1" fill="#3A322A" />
  <!-- Eye -->
  <rect x="16" y="8"  width="2" height="1" fill="#F7D43A" />
  <rect x="17" y="8"  width="1" height="1" fill="#15110D" />

  <!-- Tail curling up behind back -->
  <rect x="19" y="13" width="2" height="1" fill="#15110D" />
  <rect x="20" y="11" width="1" height="2" fill="#15110D" />
  <rect x="19" y="10" width="2" height="1" fill="#3A322A" />

  <!-- Body (horizontal oblong, sitting upright) -->
  <rect x="11" y="13" width="9" height="8" fill="#15110D" />
  <!-- Collar -->
  <rect x="11" y="13" width="9" height="1" fill="#21C2B6" />
  <!-- Collar tag -->
  <rect x="14" y="14" width="2" height="1" fill="#F7D43A" />
  <!-- Belly highlight -->
  <rect x="12" y="18" width="7" height="2" fill="#3A322A" />

  <!-- Front-right (visible) extended arm holding magnifier -->
  <rect x="6"  y="17" width="5" height="2" fill="#15110D" />
  <!-- Paw at end of arm -->
  <rect x="5"  y="18" width="1" height="2" fill="#15110D" />

  <!-- Magnifier (held in extended paw, chest level) -->
  <rect x="6"  y="14" width="4" height="1" fill="#21C2B6" />
  <rect x="5"  y="15" width="1" height="3" fill="#21C2B6" />
  <rect x="10" y="15" width="1" height="3" fill="#21C2B6" />
  <rect x="6"  y="18" width="4" height="1" fill="#21C2B6" />
  <!-- Glass interior -->
  <rect x="6"  y="15" width="4" height="3" fill="#F7F4EC" />
  <!-- Glass shine -->
  <rect x="7"  y="15" width="1" height="1" fill="#F7D43A" opacity="0.6" />
  <rect x="6"  y="16" width="1" height="1" fill="#F7D43A" opacity="0.6" />
  <!-- Handle dangling below ring toward paw -->
  <rect x="4"  y="19" width="2" height="1" fill="#15110D" />

  <!-- Front-left leg (visible, planted) -->
  <rect x="13" y="21" width="2" height="5" fill="#15110D" />
  <rect x="12" y="26" width="4" height="1" fill="#3A322A" />
  <!-- Front-right leg tucked under body — small peek -->
  <rect x="16" y="22" width="2" height="4" fill="#15110D" />
  <rect x="15" y="26" width="4" height="1" fill="#3A322A" />
  <!-- Back haunch breaking body silhouette at right -->
  <rect x="18" y="19" width="3" height="5" fill="#15110D" />
  <rect x="19" y="24" width="3" height="1" fill="#3A322A" />
  <!-- Back paw / foot -->
  <rect x="20" y="22" width="2" height="3" fill="#15110D" />
</svg>
