<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="160" height="160" shape-rendering="crispEdges" aria-label="Sniffy sniffing the ground with a scent trail ahead">
  <rect width="32" height="32" fill="none" />

  <!-- Hat tilted forward 1 col -->
  <rect x="14" y="0" width="4" height="1" fill="#3A322A" />
  <rect x="13" y="1" width="6" height="1" fill="#3A322A" />
  <rect x="15" y="1" width="2" height="1" fill="#F7D43A" />
  <rect x="12" y="2" width="8" height="2" fill="#3A322A" />
  <rect x="10" y="4" width="12" height="1" fill="#15110D" />
  <rect x="20" y="5" width="2"  height="2" fill="#3A322A" />

  <!-- Head shifted down + right -->
  <rect x="12" y="7" width="10" height="7" fill="#15110D" />
  <rect x="21" y="7" width="2"  height="4" fill="#15110D" />
  <!-- Right ear drooping lower -->
  <rect x="21" y="11" width="2" height="3" fill="#3A322A" />
  <!-- Snout reaching toward the ground -->
  <rect x="22" y="11" width="4" height="3" fill="#15110D" />
  <rect x="26" y="12" width="1" height="1" fill="#F7D43A" />
  <rect x="22" y="14" width="3" height="1" fill="#3A322A" />
  <!-- Cheek shading -->
  <rect x="15" y="13" width="4" height="1" fill="#3A322A" />
  <!-- Eye (focused, squinty) -->
  <rect x="17" y="10" width="2" height="1" fill="#F7D43A" />
  <rect x="18" y="10" width="1" height="1" fill="#15110D" />

  <!-- Tail lifted high (alert) -->
  <rect x="19" y="13" width="2" height="1" fill="#15110D" />
  <rect x="20" y="10" width="1" height="3" fill="#15110D" />
  <rect x="19" y="9"  width="2" height="1" fill="#3A322A" />

  <!-- Body -->
  <rect x="11" y="15" width="9" height="7" fill="#15110D" />
  <rect x="11" y="15" width="9" height="1" fill="#21C2B6" />
  <rect x="14" y="16" width="2" height="1" fill="#F7D43A" />
  <rect x="12" y="19" width="7" height="2" fill="#3A322A" />

  <!-- Front-right extended arm holding magnifier slightly lower -->
  <rect x="6" y="18" width="5" height="2" fill="#15110D" />
  <rect x="5" y="19" width="1" height="2" fill="#15110D" />

  <!-- Magnifier (low, near the trail) -->
  <rect x="6"  y="15" width="4" height="1" fill="#21C2B6" />
  <rect x="5"  y="16" width="1" height="3" fill="#21C2B6" />
  <rect x="10" y="16" width="1" height="3" fill="#21C2B6" />
  <rect x="6"  y="19" width="4" height="1" fill="#21C2B6" />
  <rect x="6"  y="16" width="4" height="3" fill="#F7F4EC" />
  <rect x="7"  y="16" width="1" height="1" fill="#F7D43A" opacity="0.6" />
  <rect x="4"  y="20" width="2" height="1" fill="#15110D" />

  <!-- Legs (planted, sniff posture) -->
  <rect x="13" y="22" width="2" height="4" fill="#15110D" />
  <rect x="12" y="26" width="4" height="1" fill="#3A322A" />
  <rect x="16" y="23" width="2" height="3" fill="#15110D" />
  <rect x="15" y="26" width="4" height="1" fill="#3A322A" />
  <!-- Back haunch -->
  <rect x="18" y="20" width="3" height="5" fill="#15110D" />
  <rect x="19" y="25" width="3" height="1" fill="#3A322A" />
  <rect x="20" y="23" width="2" height="3" fill="#15110D" />

  <!-- Scent trail INSIDE viewBox, ahead of nose toward the ground -->
  <rect x="26" y="14" width="1" height="1" fill="#F7D43A" opacity="1.0" />
  <rect x="28" y="16" width="1" height="1" fill="#F7D43A" opacity="0.75" />
  <rect x="29" y="19" width="1" height="1" fill="#7A6F62" opacity="0.55" />
  <rect x="30" y="22" width="1" height="1" fill="#7A6F62" opacity="0.35" />
</svg>
